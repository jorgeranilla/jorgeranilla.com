<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jorge Ranilla | Family Videos</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../style.css">
  <link rel="stylesheet" href="family/family-gallery.css?v=9">
  <link rel="icon" type="image/png" href="../images/jr-logo.png">
  <meta name="description" content="Family videos synced from Jorge Ranilla's Family Gallery YouTube playlist.">
  <link rel="canonical" href="https://jorgeranilla.com/gallery/family-videos">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://jorgeranilla.com/gallery/family-videos">
  <meta property="og:title" content="Jorge Ranilla | Family Videos">
  <meta property="og:description" content="Family videos synced from the Family Gallery YouTube playlist.">
  <meta property="og:image" content="https://jorgeranilla.com/images/og-banner.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Jorge Ranilla | Family Videos">
  <meta name="twitter:description" content="Family videos synced from the Family Gallery YouTube playlist.">
  <meta name="twitter:image" content="https://jorgeranilla.com/images/og-banner.png">
</head>

<body data-title="Family Videos" data-section="Gallery">
  <div id="social-rail-placeholder"></div>
  <div id="header-placeholder"></div>

  <div class="breadcrumb-bar">
    <nav id="breadcrumbs" class="breadcrumb-container" aria-label="Breadcrumb"></nav>
  </div>

  <main class="page-content">
    <div class="gallery-container videos-container">
      <div class="gallery-intro">
        <h2 class="page-title page-title--sm">Family Videos</h2>
        <p>Family videos synced from the Family Gallery playlist on YouTube. Click play on any video to watch it here.</p>
        <div class="gallery-summary" aria-label="Family media totals">
          <a class="gallery-summary-link" id="photo-gallery-link" href="family-photos">
            <span id="gallery-photo-count">Photos</span>
          </a>
          <div class="photo-count" id="video-count" style="display:none;"></div>
        </div>
      </div>

      <div class="gallery-loading" id="videos-loading">
        <div class="spinner"></div>
        <p>Loading family videos...</p>
      </div>

      <div class="gallery-error" id="videos-error" style="display:none;">
        <p>Couldn't load videos right now. Please try refreshing the page.</p>
      </div>

      <div class="video-category-nav" id="video-category-nav" aria-label="Video collections"></div>
      <div class="video-sections" id="video-sections"></div>
    </div>
  </main>

  <div class="lightbox video-lightbox" id="video-lightbox" aria-hidden="true">
    <button class="lightbox-close" id="video-lightbox-close" aria-label="Close">&times;</button>
    <button class="lightbox-nav lightbox-prev" id="video-lightbox-prev" aria-label="Previous">&#10094;</button>
    <button class="lightbox-nav lightbox-next" id="video-lightbox-next" aria-label="Next">&#10095;</button>
    <div class="lightbox-counter" id="video-lightbox-counter">1 / 1</div>
    <div class="lightbox-content video-lightbox-content">
      <iframe id="video-lightbox-frame" title="Family video" allowfullscreen allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"></iframe>
      <div class="video-lightbox-meta">
        <a id="video-lightbox-link" href="https://www.youtube.com/@jorgeranilla" target="_blank" rel="noopener noreferrer">Watch on YouTube</a>
      </div>
      <p class="video-lightbox-description" id="video-lightbox-description" style="display:none;"></p>
    </div>
  </div>

  <script src="../script.js?v=11"></script>
  <script src="../search-dynamic.js"></script>
  <script src="videos.js?v=4"></script>
</body>

</html>
